<style>
/* ─────────────────────────────────────────────────────────────
   VOLAFLY — Design Tokens
   Volatilität lesen. On the fly.
   ─────────────────────────────────────────────────────────────

   This file defines every token used across the Volafly brand:
   - Color primitives + semantic roles
   - Type scale + font stacks
   - Radii, shadows, spacing, motion

   The original product ships with an Apple System UI stack.
   We keep that feel on Apple devices but ship a substitute
   (Inter) for everyone else so the design looks identical.
   ───────────────────────────────────────────────────────────── */

/*
Font families defined by this CSS:
  - InterVariable  variable font for modern web browsers
  - Inter          static fonts for older web browsers (small optical size)
  - InterDisplay   static fonts for older web browsers (large optical size)

Usage example:
  :root { font-family: Inter, sans-serif; }
  @supports (font-variation-settings: normal) {
    :root { font-family: InterVariable, sans-serif; }
  }

*/
/* legacy name "Inter var" (Oct 2023) */
/* static fonts */
@font-feature-values Inter {
    @character-variant {
        cv01: 1; cv02: 2; cv03: 3; cv04: 4; cv05: 5; cv06: 6; cv07: 7; cv08: 8;
        cv09: 9; cv10: 10; cv11: 11; cv12: 12; cv13: 13;
        alt-1:            1; /* Alternate one */
        alt-3:            9; /* Flat-top three */
        open-4:           2; /* Open four */
        open-6:           3; /* Open six */
        open-9:           4; /* Open nine */
        lc-l-with-tail:   5; /* Lower-case L with tail */
        simplified-u:     6; /* Simplified u */
        alt-double-s:     7; /* Alternate German double s */
        uc-i-with-serif:  8; /* Upper-case i with serif */
        uc-g-with-spur:  10; /* Capital G with spur */
        single-story-a:  11; /* Single-story a */
        compact-lc-f:    12; /* Compact f */
        compact-lc-t:    13; /* Compact t */
    }
    @styleset {
        ss01: 1; ss02: 2; ss03: 3; ss04: 4; ss05: 5; ss06: 6; ss07: 7; ss08: 8;
        open-digits: 1;                /* Open digits */
        disambiguation: 2;             /* Disambiguation (with zero) */
        disambiguation-except-zero: 4; /* Disambiguation (no zero) */
        round-quotes-and-commas: 3;    /* Round quotes &amp; commas */
        square-punctuation: 7;         /* Square punctuation */
        square-quotes: 8;              /* Square quotes */
        circled-characters: 5;         /* Circled characters */
        squared-characters: 6;         /* Squared characters */
    }
}
@font-feature-values InterDisplay {
    @character-variant {
        cv01: 1; cv02: 2; cv03: 3; cv04: 4; cv05: 5; cv06: 6; cv07: 7; cv08: 8;
        cv09: 9; cv10: 10; cv11: 11; cv12: 12; cv13: 13;
        alt-1:            1; /* Alternate one */
        alt-3:            9; /* Flat-top three */
        open-4:           2; /* Open four */
        open-6:           3; /* Open six */
        open-9:           4; /* Open nine */
        lc-l-with-tail:   5; /* Lower-case L with tail */
        simplified-u:     6; /* Simplified u */
        alt-double-s:     7; /* Alternate German double s */
        uc-i-with-serif:  8; /* Upper-case i with serif */
        uc-g-with-spur:  10; /* Capital G with spur */
        single-story-a:  11; /* Single-story a */
        compact-lc-f:    12; /* Compact f */
        compact-lc-t:    13; /* Compact t */
    }
    @styleset {
        ss01: 1; ss02: 2; ss03: 3; ss04: 4; ss05: 5; ss06: 6; ss07: 7; ss08: 8;
        open-digits: 1;                /* Open digits */
        disambiguation: 2;             /* Disambiguation (with zero) */
        disambiguation-except-zero: 4; /* Disambiguation (no zero) */
        round-quotes-and-commas: 3;    /* Round quotes &amp; commas */
        square-punctuation: 7;         /* Square punctuation */
        square-quotes: 8;              /* Square quotes */
        circled-characters: 5;         /* Circled characters */
        squared-characters: 6;         /* Squared characters */
    }
}

:root {
  /* ── COLOR PRIMITIVES ─────────────────────────────────────── */
  /* Backgrounds — deep near-black, not pure black */
  --vf-bg-0:          #0A0A0A;  /* page */
  --vf-bg-1:          #101012;  /* elevated surface */
  --vf-bg-2:          #161618;  /* modal / sheet */
  --vf-bg-3:          #1C1C1E;  /* popover / dropdown */
  --vf-bg-4:          #2C2C2E;  /* tooltip */

  /* Text — cool off-white, with an intentional greyscale ramp */
  --vf-fg-1:          #F5F5F7;  /* primary */
  --vf-fg-2:          rgba(255,255,255,0.60);  /* body */
  --vf-fg-3:          rgba(255,255,255,0.45);  /* secondary */
  --vf-fg-4:          rgba(255,255,255,0.30);  /* tertiary / labels */
  --vf-fg-5:          rgba(255,255,255,0.20);  /* quaternary / hints */
  --vf-fg-6:          rgba(255,255,255,0.10);  /* disabled */

  /* Hairlines & borders — always semi-transparent on dark */
  --vf-border-1:      rgba(255,255,255,0.06);
  --vf-border-2:      rgba(255,255,255,0.08);
  --vf-border-3:      rgba(255,255,255,0.12);
  --vf-border-4:      rgba(255,255,255,0.18);

  /* Surface fills used for cards / pills */
  --vf-surface-1:     rgba(255,255,255,0.03);
  --vf-surface-2:     rgba(255,255,255,0.04);
  --vf-surface-3:     rgba(255,255,255,0.06);
  --vf-surface-4:     rgba(255,255,255,0.10);
  --vf-surface-5:     rgba(255,255,255,0.14);

  /* ── BRAND ACCENTS ────────────────────────────────────────── */
  --vf-accent:        #0A84FF;   /* primary — systemBlue */
  --vf-accent-press:  #0066CC;
  --vf-accent-soft:   rgba(10,132,255,0.10);
  --vf-accent-line:   rgba(10,132,255,0.28);
  --vf-accent-glow:   rgba(10,132,255,0.25);

  --vf-accent-2:      #BF5AF2;   /* violet — secondary accent (Bewertung / analysis) */
  --vf-accent-2-soft: rgba(191,90,242,0.10);
  --vf-accent-2-line: rgba(191,90,242,0.28);

  /* ── SEMANTIC — VOLATILITY CLASSES ────────────────────────── *
     These are THE five core brand colors — the whole product
     tells a story with them. Order: calm → panic.
   * ──────────────────────────────────────────────────────────── */
  --vf-class-stille:     #8E8E93;  /* 1 · Stille    — grey — complacency */
  --vf-class-ruhe:       #30D158;  /* 2 · Ruhe      — green — healthy */
  --vf-class-spannung:   #FFCC00;  /* 3 · Spannung  — yellow — uncertainty */
  --vf-class-stress:     #FF9F0A;  /* 4 · Stress    — orange — strain */
  --vf-class-panik:      #FF453A;  /* 5 · Panik     — red — capitulation */

  /* Generic semantic aliases (status) */
  --vf-success:       #30D158;
  --vf-warning:       #FFCC00;
  --vf-danger:        #FF453A;
  --vf-info:          #0A84FF;
  --vf-neutral:       #8E8E93;

  --vf-success-soft:  rgba(48,209,88,0.10);
  --vf-warning-soft:  rgba(255,204,0,0.10);
  --vf-danger-soft:   rgba(255,69,58,0.10);
  --vf-info-soft:     rgba(10,132,255,0.10);

  /* Ambient wash — used on most backgrounds */
  --vf-wash: radial-gradient(ellipse at 20% 20%, rgba(10,132,255,0.06) 0%, transparent 50%),
             radial-gradient(ellipse at 80% 80%, rgba(191,90,242,0.04) 0%, transparent 50%);

  /* ── TYPOGRAPHY STACKS ────────────────────────────────────── */
  /* Apple-first UI stack. On Apple: renders SF Pro.
     On everything else: falls back to Inter (loaded via @import).
     Inter is metric-compatible enough that layouts don't reflow. */
  --vf-font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text",
                "SF Pro Display", "Inter", "Helvetica Neue",
                "Segoe UI", Roboto, sans-serif;
  --vf-font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                     "Inter", "Helvetica Neue", sans-serif;
  --vf-font-mono: "JetBrains Mono", "SF Mono", ui-monospace,
                  "Menlo", "Monaco", monospace;

  /* ── TYPE SCALE ───────────────────────────────────────────── *
     Tight, editorial display at the top; compact UI at the bottom.
     All tracked negatively at display sizes — the Apple look.
   * ──────────────────────────────────────────────────────────── */
  --vf-t-display-xl: 56px;   /* hero numbers (Investitionsgrad %) */
  --vf-t-display-l:  42px;   /* Fear & Greed readout */
  --vf-t-display:    32px;   /* marketing H1 inline */
  --vf-t-h1:         28px;
  --vf-t-h2:         22px;
  --vf-t-h3:         18px;
  --vf-t-body-l:     15px;
  --vf-t-body:       14px;
  --vf-t-body-s:     13px;
  --vf-t-caption:    12px;   /* secondary body */
  --vf-t-label:      11px;   /* section label uppercase */
  --vf-t-meta:       10px;   /* tiny meta, uppercase */
  --vf-t-micro:       9px;   /* badges */

  /* Tracking */
  --vf-track-tight:  -0.03em;  /* display */
  --vf-track-snug:   -0.02em;  /* headings */
  --vf-track-normal: -0.01em;  /* body */
  --vf-track-wide:    0.04em;  /* labels */
  --vf-track-wider:   0.08em;  /* UPPERCASE labels */

  /* Weight tokens */
  --vf-w-regular:    400;
  --vf-w-medium:     500;
  --vf-w-semibold:   600;
  --vf-w-bold:       700;

  /* ── RADII ────────────────────────────────────────────────── */
  --vf-r-1:   4px;   /* tiny — pill badges */
  --vf-r-2:   6px;
  --vf-r-3:   8px;
  --vf-r-4:   10px;  /* small control */
  --vf-r-5:   12px;  /* input, button */
  --vf-r-6:   14px;  /* control group */
  --vf-r-7:   16px;  /* card */
  --vf-r-8:   20px;  /* modal */
  --vf-r-9:   24px;  /* mobile sheet corner */
  --vf-r-pill: 999px;

  /* ── SPACING ──────────────────────────────────────────────── *
     4-pt grid. Keep the vocabulary small. 2, 4, 6, 8, 12, 16, 24, 32, 48, 64.
   * ──────────────────────────────────────────────────────────── */
  --vf-s-0:   0;
  --vf-s-1:   2px;
  --vf-s-2:   4px;
  --vf-s-3:   6px;
  --vf-s-4:   8px;
  --vf-s-5:   12px;
  --vf-s-6:   16px;
  --vf-s-7:   24px;
  --vf-s-8:   32px;
  --vf-s-9:   48px;
  --vf-s-10:  64px;

  /* ── SHADOWS ──────────────────────────────────────────────── *
     Dark UI → shadows are mostly cast for depth, plus
     subtle inner hairlines from borders.
   * ──────────────────────────────────────────────────────────── */
  --vf-shadow-1:   0 1px 2px rgba(0,0,0,0.3);
  --vf-shadow-2:   0 4px 12px rgba(0,0,0,0.25);
  --vf-shadow-3:   0 8px 32px rgba(0,0,0,0.5);
  --vf-shadow-4:   0 16px 48px rgba(0,0,0,0.6);
  --vf-shadow-5:   0 24px 80px rgba(0,0,0,0.7);
  --vf-shadow-glow: 0 4px 16px var(--vf-accent-glow);

  /* ── MOTION ───────────────────────────────────────────────── */
  --vf-ease:         cubic-bezier(0.4, 0, 0.2, 1);
  --vf-ease-out:     cubic-bezier(0.16, 1, 0.3, 1);
  --vf-ease-spring:  cubic-bezier(0.34, 1.56, 0.64, 1);
  --vf-dur-1: 120ms;
  --vf-dur-2: 200ms;
  --vf-dur-3: 280ms;
  --vf-dur-4: 400ms;

  /* ── GLASS ────────────────────────────────────────────────── *
     The single most-used surface in the product.
   * ──────────────────────────────────────────────────────────── */
  --vf-glass-bg:     rgba(255,255,255,0.04);
  --vf-glass-blur:   blur(40px) saturate(150%);
  --vf-glass-border: 0.5px solid rgba(255,255,255,0.08);
}

/* ──────────────────────────────────────────────────────────────
   SEMANTIC ELEMENT STYLES
   Apply on a container to activate the full design language.
   ────────────────────────────────────────────────────────────── */
.vf {
  font-family: var(--vf-font-ui);
  color: var(--vf-fg-1);
  background: var(--vf-bg-0);
  background-image: var(--vf-wash);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  font-feature-settings: 'ss01', 'cv11';  /* Inter: stylistic alternates matching SF */
}

.vf h1, .vf .h1 {
  font-family: var(--vf-font-display);
  font-size: var(--vf-t-h1);
  font-weight: var(--vf-w-bold);
  letter-spacing: var(--vf-track-snug);
  line-height: 1.15;
  color: var(--vf-fg-1);
}
.vf h2, .vf .h2 {
  font-family: var(--vf-font-display);
  font-size: var(--vf-t-h2);
  font-weight: var(--vf-w-bold);
  letter-spacing: var(--vf-track-snug);
  line-height: 1.2;
  color: var(--vf-fg-1);
}
.vf h3, .vf .h3 {
  font-size: var(--vf-t-h3);
  font-weight: var(--vf-w-semibold);
  letter-spacing: var(--vf-track-normal);
  line-height: 1.3;
  color: var(--vf-fg-1);
}
.vf .display-xl {
  font-family: var(--vf-font-display);
  font-size: var(--vf-t-display-xl);
  font-weight: var(--vf-w-bold);
  letter-spacing: var(--vf-track-tight);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.vf .display-l {
  font-family: var(--vf-font-display);
  font-size: var(--vf-t-display-l);
  font-weight: var(--vf-w-bold);
  letter-spacing: var(--vf-track-tight);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.vf p, .vf .body {
  font-size: var(--vf-t-body);
  line-height: 1.6;
  color: var(--vf-fg-2);
}
.vf .body-s  { font-size: var(--vf-t-body-s); line-height: 1.55; color: var(--vf-fg-2); }
.vf .caption { font-size: var(--vf-t-caption); color: var(--vf-fg-3); }
.vf .label   {
  font-size: var(--vf-t-label);
  font-weight: var(--vf-w-semibold);
  text-transform: uppercase;
  letter-spacing: var(--vf-track-wider);
  color: var(--vf-fg-4);
}
.vf .meta    {
  font-size: var(--vf-t-meta);
  color: var(--vf-fg-4);
  letter-spacing: var(--vf-track-wide);
}
.vf code, .vf .mono, .vf .num {
  font-family: var(--vf-font-mono);
  font-variant-numeric: tabular-nums;
}

/* Base controls */
.vf .btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 11px 18px;
  border-radius: var(--vf-r-5);
  border: none;
  font-family: inherit;
  font-size: var(--vf-t-body);
  font-weight: var(--vf-w-semibold);
  cursor: pointer;
  transition: transform var(--vf-dur-1) var(--vf-ease),
              opacity var(--vf-dur-2) var(--vf-ease),
              background var(--vf-dur-2) var(--vf-ease);
  background: linear-gradient(135deg, var(--vf-accent) 0%, var(--vf-accent-press) 100%);
  color: #fff;
  box-shadow: var(--vf-shadow-glow);
}
.vf .btn:hover   { opacity: 0.92; }
.vf .btn:active  { transform: scale(0.98); }
.vf .btn.secondary {
  background: var(--vf-surface-3);
  border: 0.5px solid var(--vf-border-3);
  color: var(--vf-fg-1);
  box-shadow: none;
}
.vf .btn.ghost {
  background: transparent;
  color: var(--vf-fg-3);
  box-shadow: none;
}
.vf .btn.ghost:hover { color: var(--vf-fg-1); background: var(--vf-surface-2); }

.vf .card {
  background: var(--vf-glass-bg);
  backdrop-filter: var(--vf-glass-blur);
  -webkit-backdrop-filter: var(--vf-glass-blur);
  border: var(--vf-glass-border);
  border-radius: var(--vf-r-7);
  padding: var(--vf-s-6);
}

.vf .pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: var(--vf-r-2);
  background: var(--vf-accent-soft);
  border: 0.5px solid var(--vf-accent-line);
  font-size: var(--vf-t-meta);
  font-weight: var(--vf-w-semibold);
  color: var(--vf-accent);
  letter-spacing: var(--vf-track-wide);
}

</style>
<style>

  const SHEETS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSsmLGq2ejgt-yg-ER16AuBC2cjPmHJLa4voisbpgmo3qpNMo7LMNus01PLp6etdn2CJb9724Bp6y-d/pub?gid=0&single=true&output=csv';

  // RFC-4180-kompatibler CSV-Parser: versteht quoted fields mit Kommas/Semikolons darin
  const parseCsvLine = (line, sep) => {
    const fields = [];
    let cur = '';
    let inQuote = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        if (inQuote && line[i + 1] === '"') { cur += '"'; i++; } // escaped quote
        else inQuote = !inQuote;
      } else if (ch === sep && !inQuote) {
        fields.push(cur.trim());
        cur = '';
      } else {
        cur += ch;
      }
    }
    fields.push(cur.trim());
    return fields;
  };

  const parseSheetsCsv = (text) => {
    const lines = text.replace(/\r/g, '').split('\n');
    const data = {};
    const descs = {};
    if (lines.length < 2) return { data, descs };

    // Detect separator from header
    const header = lines[0];
    const sep = header.includes(';') ? ';' : ',';

    for (let i = 1; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line) continue;

      // Case A: line is a single quoted field containing semicolons (old format)
      // e.g. "VXN;29,87;Desc;",,url
      if (line.startsWith('"') && line.includes(';')) {
        let end = 1;
        while (end < line.length) {
          if (line[end] === '"') {
            if (line[end + 1] === '"') { end += 2; continue; }
            break;
          }
          end++;
        }
        const payload = line.slice(1, end).replace(/""/g, '"');
        if (payload.includes(';')) {
          const parts = parseCsvLine(payload, ';');
          if (parts.length < 2) continue;
          const metric = parts[0].trim();
          if (!metric) continue;
          const valueStr = parts[1].trim().replace(',', '.');
          const value = parseFloat(valueStr);
          if (!isNaN(value)) data[metric] = value;
          if (parts.length >= 3) {
            const desc = parts[2].replace(/;$/, '').trim();
            if (desc) descs[metric] = desc;
          }
          continue;
        }
      }

      // Case B: proper multi-column CSV (sep = , or ;)
      // When sep=',': fields are [Metric, IntPart, DecPart, Desc...] if value has decimal comma
      // e.g. VXN,29,87,Der CBOE Nasdaq...
      // We detect this by checking if field[1] is digits-only and field[2] is digits-only
      const rawParts = parseCsvLine(line, sep);
      if (rawParts.length < 2) continue;

      const metric = rawParts[0].replace(/^["']|["']$/g, '').trim();
      if (!metric) continue;

      let valueStr = rawParts[1].replace(/^["']|["']$/g, '').trim();
      let descIndex = 2;

      // If sep=',' and value looks like it was split on decimal comma:
      // rawParts[1] = "29" and rawParts[2] = "87" (both pure digits/numbers, no letters)
      if (sep === ',' && rawParts.length >= 3) {
        const part1 = rawParts[1].trim();
        const part2 = rawParts[2].trim();
        if (/^\d+$/.test(part1) && /^\d+$/.test(part2)) {
          // Rejoin as decimal number with dot
          valueStr = part1 + '.' + part2;
          descIndex = 3;
        }
      }

      const value = parseFloat(valueStr.replace(',', '.'));
      if (!isNaN(value)) data[metric] = value;

      if (rawParts.length > descIndex) {
        const desc = rawParts[descIndex].replace(/^["']|["']$/g, '').replace(/;$/, '').trim();
        if (desc) descs[metric] = desc;
      }
    }
    return { data, descs };
  };

      },

  };

  // ── Tab "ETF_RSI" laden (Sektor-/Branchen-RSI vom Scraper) ──
  const fetchEtfRsi = async () => {
    try {
      const res = await fetch(ETF_RSI_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      const lines = text.split(/\r?\n/).filter(l => l.trim());
      if (lines.length < 2) return;
      const sep = lines[0].includes(';') ? ';' : ',';
      const header = parseCsvLine(lines[0], sep).map(h => h.toLowerCase());
      const iT = header.indexOf('ticker'), iTyp = header.indexOf('typ'),
            iN = header.indexOf('name'), iR = header.indexOf('rsi'), iS = header.indexOf('stand');
      if (iT < 0 || iR < 0) return; // falsches Tab / gid noch nicht gesetzt
      const rows = lines.slice(1).map(l => {
        const fl = parseCsvLine(l, sep);
        const rsi = parseFloat(String(fl[iR] ?? '').replace(',', '.'));
        return {
          ticker: fl[iT] || '',
          typ: iTyp >= 0 ? (fl[iTyp] || '') : '',
          name: iN >= 0 ? (fl[iN] || '') : '',
          rsi: isNaN(rsi) ? null : rsi,
          stand: iS >= 0 ? (fl[iS] || '') : '',
        };
      }).filter(r => r.ticker && r.rsi != null);
      if (rows.length) setEtfRsi(rows);
    } catch (e) { /* Karte bleibt ausgeblendet — kein Fehler-UI nötig */ }
  };

  const fetchFromSheets = async (isAutoLoad = false, retryCount = 0) => {
    setFetchLoading(true);
    fetchEtfRsi();
    try {
      const res = await fetch(SHEETS_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      const firstLine = text.split(/\r?\n/)[0] || '';
      const detectedSep = firstLine.includes(';') ? ';' : ',';
      // Leere Antwort → einmal automatisch retry nach 1.5s
      if (!firstLine.trim() && retryCount < 2) {
        setFetchLoading(false);
        setTimeout(() => fetchFromSheets(isAutoLoad, retryCount + 1), 1500);
        return;
      }
      const { data, descs } = parseSheetsCsv(text);
      const known = ['VIX','RVX','VXN','VVIX','VXV','Fear_Greed_Index','Equity_Put_Call_Ratio',
        'Total_Put_Call_Ratio','SKEW_Index','MOVE_Index','Left_Tail_Volatility',
        'VX1','VX2','VX3','VX4','VX5','Yield_2Y','Yield_10Y','Yield_30Y',
        'S5FD_Above_5Day_MA','S5TW_Above_20Day_MA','S5FI_Above_50Day_MA','S5TH_Above_200Day_MA',
        'HY_Spread','DXY','Gold_SP_Ratio','Gold','Silver','WTI','SPX','NDX','RUT','SPX_200D','NDX_200D',
        'VIXEQ','DFII10','DFII30','SPX_RSI','NDX_RSI','Crypto_Fear_Greed_Index'];
      const found = known.filter(k => data[k] !== undefined);
      if (found.length === 0) {
        // Beim Auto-Load: retry statt Fehler zeigen
        if (isAutoLoad && retryCount < 2) {
          setFetchLoading(false);
          setTimeout(() => fetchFromSheets(true, retryCount + 1), 1500);
          return;
        }
        throw new Error(`Keine bekannten Felder gefunden (Sep: "${detectedSep}", Header: "${firstLine.slice(0,60)}")`);
      }
      applySheetData(data);
      if (Object.keys(descs).length > 0) setSheetDescs(descs);
      setLastImportDate(new Date());
    } catch (err) {
      setCsvStatus({ type: 'error', msg: `Google Sheets: ${err.message}` });
    }
    setFetchLoading(false);
    setTimeout(() => setCsvStatus(null), 4000);
  };

  const applyPresetById = (pid) => {
    const tpl = PRESET_TEMPLATES.find(t => t.id === pid);
    if (!tpl) return;
    const n = tpl.classes.length;
    // Merge: defaultThresholds als Basis, dann Template-Werte drüber
    const merged = Object.fromEntries(Object.entries(defaultThresholds).map(([key, def]) => {
      const tplVal = tpl.thresholds[key];
      if (!tplVal) return [key, { ...def, active: false }];
      // Falls Template nur true enthält → nur aktivieren, Default-Werte behalten
      if (tplVal === true) {
        const vals = [...def.values];
        while (vals.length < n - 1) vals.push(vals[vals.length-1] ?? 0);
        return [key, { ...def, active: true, values: vals.slice(0, n-1) }];
      }
      // Falls Template vollständige Definition enthält → übernehmen
      const vals = [...(tplVal.values || def.values)];
      while (vals.length < n - 1) vals.push(vals[vals.length-1] ?? 0);
      return [key, {
        ...def,
        active: true,
        values: vals.slice(0, n-1),
        dir: tplVal.dir || def.dir,
        weight: tplVal.weight || def.weight,
      }];
    }));
    const equalized = computeEqualWeights(merged);
    setVolaClasses(tpl.classes);
    setThresholds(equalized);
    setActiveTemplateId(pid);
    // Clear own profile standard in state (DB cleared separately via saveDefaultPreset)
    setProfiles(prev => prev.map(p => ({ ...p, is_default: false })));
  };

  const handleFileUpload = (event) => {
    const file = event.target.files[0];
    if (!file) return;

    // Dateiformat prüfen
    if (!file.name.match(/\.(csv|txt)$/i)) {
      setCsvStatus({ type: 'error', msg: 'Ungültiges Format — bitte eine .csv oder .txt Datei hochladen' });
      setTimeout(() => setCsvStatus(null), 4000);
      event.target.value = '';
      return;
    }

    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const text = e.target.result;
        const lines = text.split(/\r?\n/);

        // Mindest-Struktur prüfen: Header-Zeile muss existieren
        if (lines.length < 2) {
          setCsvStatus({ type: 'error', msg: 'CSV ist leer oder hat kein gültiges Format' });
          setTimeout(() => setCsvStatus(null), 4000);
          event.target.value = ''; return;
        }

        const headerRaw = lines[0].replace(/^["']|["']$/g, '');
        const sep = headerRaw.includes(';') ? ';' : ',';

        const data = {};
        for (let i = 1; i < lines.length; i++) {
          const line = lines[i].trim();
          if (!line) continue;
          const parts = parseCsvLine(line, sep);
          if (parts.length >= 2) {
            const metric = parts[0].replace(/^["']|["']$/g, '').trim();
            const valueStr = parts[1].replace(/^["']|["']$/g, '').trim().replace(',', '.');
            const value = parseFloat(valueStr);
            if (!isNaN(value)) data[metric] = value;
          }
        }

        // Prüfen ob mindestens ein bekanntes Feld vorhanden ist
        const knownFields = ['VIX','RVX','VXN','VVIX','VXV','Fear_Greed_Index','Equity_Put_Call_Ratio',
          'Total_Put_Call_Ratio','SKEW_Index','MOVE_Index','Left_Tail_Volatility',
          'VX1','VX2','VX3','VX4','VX5','Yield_2Y','Yield_10Y','Yield_30Y',
          'S5FD_Above_5Day_MA','S5TW_Above_20Day_MA','S5FI_Above_50Day_MA','S5TH_Above_200Day_MA',
          'HY_Spread','DXY','Gold_SP_Ratio','Gold','Silver','WTI','SPX','NDX','RUT','SPX_200D','NDX_200D',
          'VIXEQ','DFII10','DFII30','SPX_RSI','NDX_RSI','Crypto_Fear_Greed_Index'];
        const foundFields = knownFields.filter(k => data[k] !== undefined);
        if (foundFields.length === 0) {
          setCsvStatus({ type: 'error', msg: 'Keine bekannten Felder gefunden — bitte das Template als Vorlage verwenden' });
          setTimeout(() => setCsvStatus(null), 5000);
          event.target.value = ''; return;
        }

        const newData = {
          volatilityMetrics: {
            rvx: data.RVX ?? marketData.volatilityMetrics.rvx,
            vxn: data.VXN ?? marketData.volatilityMetrics.vxn,
            vix: data.VIX ?? marketData.volatilityMetrics.vix,
            vvix: data.VVIX ?? marketData.volatilityMetrics.vvix,
            vxv: data.VXV ?? marketData.volatilityMetrics.vxv,
            fearGreed: data.Fear_Greed_Index ?? marketData.volatilityMetrics.fearGreed,
            equityPutCall: data.Equity_Put_Call_Ratio ?? marketData.volatilityMetrics.equityPutCall,
            totalPutCall: data.Total_Put_Call_Ratio ?? marketData.volatilityMetrics.totalPutCall,
            skewIndex: data.SKEW_Index ?? marketData.volatilityMetrics.skewIndex,
            moveIndex: data.MOVE_Index ?? marketData.volatilityMetrics.moveIndex,

        setMarketData(newData);

        const missing = knownFields.length - foundFields.length;

  const f = (n, d = 1) => n.toFixed(d).replace('.', ',');

  const fearColor = v.fearGreed < 25 ? '#FF3B30' : v.fearGreed < 45 ? '#FF9500' : v.fearGreed < 55 ? '#FFCC00' : v.fearGreed < 75 ? '#34C759' : '#30D158';
  const contango = v.vx5 > v.vx1;

  // RSI(14) 0..100 → Farbe (≥70 überkauft, ≤30 überverkauft)

  const formatTime = (date) => {

  const sectionLabel = {

  const metricLabel = { fontSize: '10px', color: 'rgba(255,255,255,0.52)', fontWeight: 500, marginBottom: '2px' };
  const metricValue = (color = '#F5F5F7') => ({ fontSize: '18px', fontWeight: 600, color, letterSpacing: '-0.02em', fontVariantNumeric: 'tabular-nums' });

  // ── Anticyclical Volatility Classification ──
  // 5 classes: higher vola class = more fear = higher investment grade (anticyclical)
  const defaultVolaClasses = [
    { label: 'Stille',   color: '#8E8E93', investPct: 40,  subtitle: 'Markt zu ruhig — Complacency-Risiko',          desc: 'Der Markt ist ungewöhnlich ruhig — Vorsicht vor Selbstgefälligkeit. Investitionsgrad bis zu 40% ist angemessen.' },
    { label: 'Ruhe',     color: '#30D158', investPct: 60,  subtitle: 'Geringes Stressniveau — Basis-Exposure',        desc: 'Geringes Stressniveau. Ein rationaler Investor hält eine solide Basis-Position von bis zu 60%.' },
    { label: 'Spannung', color: '#FFCC00', investPct: 80,  subtitle: 'Erhöhte Unsicherheit — selektiv aufbauen',      desc: 'Erhöhte Unsicherheit im Markt. Jetzt selektiv aufbauen — bis zu 80% Investitionsgrad ist rational.' },
    { label: 'Stress',   color: '#FF9F0A', investPct: 90,  subtitle: 'Deutlicher Stress — antizyklisch erhöhen',      desc: 'Deutlicher Stress im Markt. Ein rationaler Investor erhöht jetzt antizyklisch auf bis zu 90%.' },
    { label: 'Panik',    color: '#FF453A', investPct: 110, subtitle: 'Kapitulation — aggressiv investieren',          desc: 'Kapitulation — maximale Angst im Markt. Historisch der beste Kaufzeitpunkt. Bis zu 110% Investitionsgrad ist rational.' },
  ];
  const [volaClasses, setVolaClasses] = useState(defaultVolaClasses);
  const [draftVolaClasses, setDraftVolaClasses] = useState(defaultVolaClasses);
  const [classesError, setClassesError] = useState('');

  // ── Vorgefertigte Templates ──
  const classifyFromConfig = (key, value) => {
    const cfg = thresholds[key] ?? defaultThresholds[key];
    if (!cfg) return null;
    const n = volaClasses.length;
    // values has n-1 entries (thresholds between classes)
    const vals = cfg.values.slice(0, n - 1);
    if (cfg.dir === 'asc') {
      for (let i = 0; i < vals.length; i++) { if (value <= vals[i]) return i + 1; }
      return n;
    } else {
      for (let i = 0; i < vals.length; i++) { if (value >= vals[i]) return i + 1; }
      return n;
    }
  };

  // Computed spreads
  const vx1Spread = v.vx1 - v.vix;
  const vx2Spread = v.vx2 - v.vx1;

  // Gold / S&P 500 live ratio
  const goldSPRatio = (idx.spx > 0 && ri.gold > 0) ? idx.spx / ri.gold : (ri.goldSP > 0 ? 1 / ri.goldSP : 0);

  // SPX/NDX above 200D: 0 = below, 1 = above (for threshold: desc, threshold[0]=1 means above=Stille)
  const spxAbove200d = (idx.spx > 0 && idx.spx200d > 0) ? (idx.spx > idx.spx200d ? 1 : 0) : null;
  const ndxAbove200d = (idx.ndx > 0 && idx.ndx200d > 0) ? (idx.ndx > idx.ndx200d ? 1 : 0) : null;

  // Individual indicator assessments
  const indicators = [
    { group: 'Volatilität', label: 'VIX', key: 'vix', level: classifyFromConfig('vix', v.vix), value: f(v.vix) },
    { group: 'Volatilität', label: 'RVX', key: 'rvx', level: classifyFromConfig('rvx', v.rvx), value: f(v.rvx) },
    { group: 'Volatilität', label: 'VXN', key: 'vxn', level: classifyFromConfig('vxn', v.vxn), value: f(v.vxn) },
    { group: 'Volatilität', label: 'VVIX', key: 'vvix', level: classifyFromConfig('vvix', v.vvix), value: f(v.vvix) },
    { group: 'Struktur', label: 'VIX/VXV', key: 'vixVxv', level: classifyFromConfig('vixVxv', vixRatio), value: f(vixRatio, 3) },
    { group: 'Struktur', label: 'VX1 – VIX Spot', key: 'vx1Spread', level: classifyFromConfig('vx1Spread', vx1Spread), value: (vx1Spread >= 0 ? '+' : '') + f(vx1Spread, 2) },
    { group: 'Struktur', label: 'VX2 – VX1', key: 'vx2Spread', level: classifyFromConfig('vx2Spread', vx2Spread), value: (vx2Spread >= 0 ? '+' : '') + f(vx2Spread, 2) },
    { group: 'Sentiment', label: 'Fear & Greed', key: 'fearGreed', level: classifyFromConfig('fearGreed', v.fearGreed), value: String(v.fearGreed) },
    { group: 'Sentiment', label: 'Equity P/C', key: 'equityPutCall', level: classifyFromConfig('equityPutCall', v.equityPutCall), value: f(v.equityPutCall, 2) },
    { group: 'Kapitalfluss', label: 'HY Credit Spread', key: 'hySpread', level: classifyFromConfig('hySpread', ri.hySpread), value: f(ri.hySpread, 2) + '%' },
    { group: 'Kapitalfluss', label: 'DXY', key: 'dxy', level: classifyFromConfig('dxy', ri.dxy), value: f(ri.dxy, 1) },
    { group: 'Kapitalfluss', label: 'Gold/S&P', key: 'goldSP', level: classifyFromConfig('goldSP', goldSPRatio), value: f(goldSPRatio, 3) },
    { group: 'Kapitalfluss', label: 'WTI Öl', key: 'wti', level: classifyFromConfig('wti', ri.wti), value: '$' + f(ri.wti, 1) },
    { group: 'Zinsen', label: '10Y–2Y Spread', key: 'yieldSpread', level: classifyFromConfig('yieldSpread', y.y10 - y.y2), value: (y.y10 - y.y2 >= 0 ? '+' : '') + f(y.y10 - y.y2, 2) + '%' },
    ...(spxAbove200d !== null ? [{ group: 'Aktienmarkt', label: 'SPX über 200T', key: 'spxAbove200d', level: classifyFromConfig('spxAbove200d', spxAbove200d), value: spxAbove200d === 1 ? 'Ja' : 'Nein' }] : []),
    ...(ndxAbove200d !== null ? [{ group: 'Aktienmarkt', label: 'NDX über 200T', key: 'ndxAbove200d', level: classifyFromConfig('ndxAbove200d', ndxAbove200d), value: ndxAbove200d === 1 ? 'Ja' : 'Nein' }] : []),
  ].filter(ind => ind.level !== null && (thresholds[ind.key]?.active !== false));

  // Weighted average → overall vola class
  const totalWeight = indicators.reduce((sum, ind) => sum + (thresholds[ind.key]?.weight ?? 1), 0) || 1;
  const weightedSum = indicators.reduce((sum, ind) => sum + ind.level * (thresholds[ind.key]?.weight ?? 1), 0);
  const avgLevel = indicators.length > 0 ? weightedSum / totalWeight : 1;
  const overallLevel = Math.min(5, Math.max(1, Math.round(avgLevel)));
  const currentClass = volaClasses[overallLevel - 1];
  // Derive active template name for display
  const activeTemplateName = (() => {
    if (!activeTemplateId) return null;
    if (activeTemplateId.startsWith('profile-')) {
      const pid = activeTemplateId.replace('profile-', '');
      const p = profiles.find(x => x.id === pid);
      return p ? p.name : null;
    }
    const t = PRESET_TEMPLATES.find(x => x.id === activeTemplateId);
    return t ? t.name : null;
  })();

  // Distribution
  const levelDistribution = volaClasses.map((_, i) => indicators.filter(ind => ind.level === i + 1).length);

  const AssessmentRow = ({ label, level, value }) => {

  // ── Tooltip helper ──
  // Map: tooltip ID → CSV Metric key (for Desc lookup)
  const TOOLTIP_CSV_KEY = {

    y2: 'Yield_2Y', y10: 'Yield_10Y', y30: 'Yield_30Y',
    vix: 'VIX', rvx: 'RVX', vxn: 'VXN', vvix: 'VVIX', vixVxv: 'VXV',
    skew: 'SKEW_Index', move: 'MOVE_Index', leftTail: 'Left_Tail_Volatility',

    yieldSpread: 'Yield_10Y', // kein eigenes Key — nutzt 10Y-Eintrag als Fallback
  };

  const TT = ({ id, children }) => {

    const sheetDesc = csvKey ? sheetDescs[csvKey] : undefined;

    } : null;
    return (

              {tip.desc.split('\n\n').map((block, bi) => (

  };

  // ── Hover-Tooltip für dynamische Inhalte ──
  const HoverTip = ({ tipKey, content, width = 210, children }) => (
    <div style={{ position: 'relative', display: 'block', width: '100%' }}
      onMouseEnter={() => setHoverTip(tipKey)} onMouseLeave={() => setHoverTip(null)}>

        <div style={{

          border: '0.5px solid rgba(255,255,255,0.14)', borderRadius: '12px', padding: '9px 12px',
          width: `${width}px`, boxShadow: '0 4px 24px rgba(0,0,0,0.5)', pointerEvents: 'none',
          fontSize: '11px', lineHeight: 1.5, color: 'rgba(255,255,255,0.7)', textAlign: 'left', whiteSpace: 'normal',
        }}>{content}</div>
      )}
    </div>
  );

  // ── Gauge (Halbkreis-Tacho) ──
  const gaugePolar = (cx, cy, r, deg) => { const a = deg * Math.PI / 180; return [cx + r * Math.cos(a), cy - r * Math.sin(a)]; };
  const gaugeArc = (cx, cy, r, s, e) => { const p1 = gaugePolar(cx, cy, r, s), p2 = gaugePolar(cx, cy, r, e); return `M ${p1[0].toFixed(2)} ${p1[1].toFixed(2)} A ${r} ${r} 0 ${Math.abs(e - s) > 180 ? 1 : 0} ${s > e ? 1 : 0} ${p2[0].toFixed(2)} ${p2[1].toFixed(2)}`; };
  const gaugeVAng = v => 180 - (Math.max(0, Math.min(100, v)) / 100) * 180;
  const Gauge = ({ value, type, small = false, caption, tipKey, tipText, pct, num, zoneColor, zoneLabel, leftColor, rightColor, zoneStart = 33, zoneEnd = 66, extraDots }) => {
    const W = small ? 96 : 130, R = small ? 40 : 55, SW = small ? 7 : 9;
    const cx = W / 2, cy = R + 13, H = cy + 13;
    const isMacro = type === 'macro';
    const has = isMacro ? (pct != null) : (value != null);
    const clamp = isMacro ? Math.max(0, Math.min(100, pct || 0)) : (has ? Math.max(0, Math.min(100, value)) : 0);
    const np = gaugePolar(cx, cy, R, gaugeVAng(clamp));
    let zone;
    if (isMacro) { const dim = zoneColor === 'rgba(255,255,255,0.35)'; zone = { c: dim ? '#AEAEB2' : zoneColor, t: zoneLabel }; }
    else if (type === 'fg') zone = clamp < 25 ? { c: '#FF453A', t: 'Extreme Angst' } : clamp < 45 ? { c: '#FF9F0A', t: 'Angst' } : clamp < 55 ? { c: '#FFCC00', t: 'neutral' } : clamp < 75 ? { c: '#34C759', t: 'Gier' } : { c: '#30D158', t: 'Extreme Gier' };
    else if (type === 'rsi') zone = !has ? { c: 'rgba(255,255,255,0.3)', t: '—' } : value >= 70 ? { c: '#FF9F0A', t: 'überkauft' } : value <= 30 ? { c: '#30D158', t: 'überverkauft' } : { c: '#F5F5F7', t: 'neutral' };
    else if (type === 'risk') zone = !has ? { c: 'rgba(255,255,255,0.3)', t: '—' } : clamp < 35 ? { c: '#30D158', t: 'niedrig' } : clamp < 65 ? { c: '#FFCC00', t: 'neutral' } : { c: '#FF453A', t: 'hoch' };
    else zone = clamp < 45 ? { c: '#FF453A', t: 'schwach' } : clamp < 55 ? { c: '#FFCC00', t: 'neutral' } : { c: '#30D158', t: 'stark' };
    const gid = 'gg_' + tipKey;
    const numTxt = isMacro ? num : (!has ? '—' : type === 'rsi' ? f(value, 1) : Math.round(value) + (type === 'breadth' ? '%' : ''));
    const numColor = isMacro ? '#F5F5F7' : zone.c;
    const useGrad = type === 'fg' || type === 'breadth' || type === 'risk';
    const stops = type === 'fg'
      ? [['0%', '#FF453A'], ['35%', '#FF9F0A'], ['55%', '#FFCC00'], ['100%', '#30D158']]
      : type === 'risk'
      ? [['0%', '#30D158'], ['50%', '#FFCC00'], ['100%', '#FF453A']]
      : [['0%', '#FF453A'], ['50%', '#FFCC00'], ['100%', '#30D158']];
    const g = 3, aS = gaugeVAng(zoneStart), aE = gaugeVAng(zoneEnd);
    const body = (
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', width: '100%', cursor: tipText ? 'help' : 'default' }}>
        <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ display: 'block', maxWidth: `${W}px` }}>
          {useGrad && (
            <defs><linearGradient id={gid} x1="0" y1="0" x2="1" y2="0">
              {stops.map((s, si) => <stop key={si} offset={s[0]} stopColor={s[1]} />)}
            </linearGradient></defs>
          )}
          {isMacro ? (
            <g>
              <path d={gaugeArc(cx, cy, R, 180, aS + g)} stroke={leftColor || '#8E8E93'} strokeWidth={SW} fill="none" strokeLinecap="round" />
              <path d={gaugeArc(cx, cy, R, aS - g, aE + g)} stroke="#48484A" strokeWidth={SW} fill="none" strokeLinecap="round" />
              <path d={gaugeArc(cx, cy, R, aE - g, 0)} stroke={rightColor || '#8E8E93'} strokeWidth={SW} fill="none" strokeLinecap="round" />
            </g>
          ) : type === 'rsi' ? (
            <g>
              <path d={gaugeArc(cx, cy, R, 180, 0)} stroke="rgba(255,255,255,0.07)" strokeWidth={SW} fill="none" strokeLinecap="round" />
              <path d={gaugeArc(cx, cy, R, 180, gaugeVAng(30))} stroke="#30D158" strokeWidth={SW} fill="none" strokeLinecap="round" />
              <path d={gaugeArc(cx, cy, R, gaugeVAng(70), 0)} stroke="#FF9F0A" strokeWidth={SW} fill="none" strokeLinecap="round" />
            </g>
          ) : (
            <g>
              <path d={gaugeArc(cx, cy, R, 180, 0)} stroke="rgba(255,255,255,0.07)" strokeWidth={SW} fill="none" strokeLinecap="round" />
              <path d={gaugeArc(cx, cy, R, 180, 0)} stroke={`url(#${gid})`} strokeWidth={SW} fill="none" strokeLinecap="round" />
            </g>

                      onMouseEnter={e => e.currentTarget.style.background='rgba(255,69,58,0.25)'}
                      onMouseLeave={e => e.currentTarget.style.background='rgba(255,69,58,0.12)'}>
                      ×
                    </button>
                  </div>
                );
              })}

                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px' }}>
                    {Object.entries(draftThresholds).filter(([,c]) => c.active === false).map(([key, cfg]) => (

                        onMouseEnter={e => { e.currentTarget.style.background='rgba(10,132,255,0.1)'; e.currentTarget.style.color='#0A84FF'; e.currentTarget.style.borderColor='rgba(10,132,255,0.3)'; }}
                        onMouseLeave={e => { e.currentTarget.style.background='rgba(255,255,255,0.04)'; e.currentTarget.style.color='rgba(255,255,255,0.45)'; e.currentTarget.style.borderColor='rgba(255,255,255,0.12)'; }}>
                        + {cfg.label}
                      </button>
                    ))}
                  </div>
                </div>
              )}

              <div style={{ marginTop: '12px', fontSize: '10px', color: 'rgba(255,255,255,0.5)', lineHeight: 1.5 }}>
                <strong style={{ color: 'rgba(255,255,255,0.56)' }}>↑ steigend:</strong> Werte müssen aufsteigend und unterschiedlich sein · <strong style={{ color: 'rgba(255,255,255,0.56)' }}>↓ fallend:</strong> absteigend
              </div>
                </>
              ))} {/* end thresholds tab */}


              {/* Global error summary — only active indicators */}
              {configTab === 'thresholds' && Object.entries(validationErrors).filter(([k]) => draftThresholds[k]?.active !== false).length > 0 && (
                <div style={{ marginTop: '12px', padding: '10px 14px', borderRadius: '12px', background: 'rgba(255,69,58,0.08)', border: '0.5px solid rgba(255,69,58,0.2)', fontSize: '11px', color: '#FF453A', lineHeight: 1.5 }}>
                  {Object.entries(validationErrors).filter(([k]) => draftThresholds[k]?.active !== false).map(([k, msg], i) => <div key={i}>• {msg}</div>)}

              {/* ── Footer: Klassen-Tab ── */}
              {configTab === 'classes' && classesError && (
                <div style={{ marginBottom: '0', padding: '10px 14px', borderRadius: '12px', background: 'rgba(255,69,58,0.08)', border: '0.5px solid rgba(255,69,58,0.25)', fontSize: '12px', color: '#FF453A', lineHeight: 1.5 }}>

                      setClassesError('');
                    }}
                    style={{ padding: '12px 16px', borderRadius: '12px', border: '0.5px solid rgba(255,255,255,0.1)', cursor: 'pointer', background: 'rgba(255,255,255,0.03)', color: 'rgba(255,255,255,0.56)', fontSize: '13px', fontWeight: 600, whiteSpace: 'nowrap', fontFamily: 'inherit' }}
                    onMouseEnter={e => { e.currentTarget.style.background='rgba(255,255,255,0.08)'; e.currentTarget.style.color='#F5F5F7'; }}
                    onMouseLeave={e => { e.currentTarget.style.background='rgba(255,255,255,0.04)'; e.currentTarget.style.color='rgba(255,255,255,0.4)'; }}>

                    onClick={() => {
                      setClassesError('');

                      const pcts = draftVolaClasses.map(c => c.investPct);
                      // Aufsteigend-Prüfung
                      for (let i = 1; i < pcts.length; i++) {
                        if (pcts[i] <= pcts[i-1]) {
                          setClassesError(`Investitionsgrade müssen aufsteigend sein — "${draftVolaClasses[i-1].name}" (${pcts[i-1]}%) muss kleiner sein als "${draftVolaClasses[i].name}" (${pcts[i]}%).`);
                          return;

                      }
                      const dupes = pcts.filter((p,i) => pcts.indexOf(p) !== i);

                    onMouseEnter={e => { if (!Object.entries(validationErrors).filter(([k]) => draftThresholds[k]?.active !== false).length) e.currentTarget.style.opacity='0.85'; }}

                        onFocus={e => e.target.style.borderColor='rgba(10,132,255,0.5)'}
                        onBlur={e => e.target.style.borderColor='rgba(255,255,255,0.12)'}
                        autoFocus
                      />
                      <button
                        onClick={async () => {
                          const name = newTemplateName.trim();
                          if (!name) return;
                          if (profiles.length >= 3) {
                            setSaveTemplateMsg({ type: 'error', text: 'Limit erreicht (3/3) — lösche eine Konfiguration um eine neue zu speichern.' });
                            return;
                          }
                          if (profiles.some(p => p.name.trim().toLowerCase() === name.toLowerCase())) {
                            setSaveTemplateMsg({ type: 'error', text: `„${name}“ existiert bereits — bitte einen anderen Namen wählen.` });
                            return;
                          }
                          setProfileLoading(true);
                          const isFirst = profiles.length === 0;
                          const { data, error } = await sbClient
                            .from('threshold_profiles')
                            .insert({ user_id: user.id, name, thresholds, is_default: isFirst })
                            .select().single();
                          setProfileLoading(false);
                          if (!error && data) {
                            setProfiles(prev => [data, ...prev]);
                            setActiveProfileId(data.id);
                            if (isFirst) {
                              setDefaultPresetId(null);
                              sbClient.from('notification_preferences').upsert({ user_id: user.id, email: user.email, default_preset_id: null, updated_at: new Date().toISOString() }, { onConflict: 'user_id' });
                            }
                            setSaveTemplateMsg({ type: 'success', text: `„${name}" gespeichert` });
                            setNewTemplateName('');
                            setTimeout(() => { setSaveTemplateMsg(null); setShowSaveTemplate(false); setShowConfig(false); }, 1800);
                          } else {
                            setSaveTemplateMsg({ type: 'error', text: 'Fehler beim Speichern' });
                          }
                        }}
                        disabled={!newTemplateName.trim() || profileLoading}
                        style={{ padding: '9px 16px', borderRadius: '12px', border: 'none', cursor: newTemplateName.trim() ? 'pointer' : 'default', background: newTemplateName.trim() ? '#30D158' : 'rgba(255,255,255,0.08)', color: newTemplateName.trim() ? '#000' : 'rgba(255,255,255,0.25)', fontSize: '13px', fontWeight: 600, fontFamily: 'inherit', whiteSpace: 'nowrap' }}>
                        {profileLoading ? '…' : 'Speichern'}
                      </button>
                      <button
                        onClick={() => { setShowSaveTemplate(false); setShowConfig(false); }}
                        style={{ padding: '9px 12px', borderRadius: '12px', border: '0.5px solid rgba(255,255,255,0.1)', background: 'rgba(255,255,255,0.03)', color: 'rgba(255,255,255,0.56)', fontSize: '13px', fontFamily: 'inherit', cursor: 'pointer' }}>
                        Überspringen
                      </button>
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>
        )}

        {/* CSV Status Toast */}
        {csvStatus && (
          <div style={{
            marginBottom: '8px', padding: '10px 14px', borderRadius: '12px',
            background: csvStatus.type === 'success' ? 'rgba(48,209,88,0.08)' : 'rgba(255,69,58,0.08)',
            border: `0.5px solid ${csvStatus.type === 'success' ? 'rgba(48,209,88,0.2)' : 'rgba(255,69,58,0.2)'}`,
            fontSize: '11px', fontWeight: 500,
            color: csvStatus.type === 'success' ? '#30D158' : '#FF453A',
            display: 'flex', alignItems: 'center', gap: '8px',
          }}>
            <span>{csvStatus.type === 'success' ? '✓' : '⚠'} {csvStatus.msg}</span>
            <button onClick={() => setCsvStatus(null)} style={{
              marginLeft: 'auto', background: 'none', border: 'none',
              color: 'rgba(255,255,255,0.52)', cursor: 'pointer', fontSize: '14px', lineHeight: 1,
            }}>×</button>
          </div>
        )}

        {/* Tab Content */}
        {activeTab === 'data' ? <DataView /> : (
          <>
            {/* Option A — Kontext-Banner oben im Bewertungs-Tab */}
            <div style={{ display: 'flex', flexDirection: isMobile ? 'column' : 'row', alignItems: isMobile ? 'flex-start' : 'center', justifyContent: 'space-between', gap: '8px', marginBottom: '8px', padding: '9px 14px', background: 'rgba(255,255,255,0.03)', border: '0.5px solid rgba(255,255,255,0.08)', borderRadius: '12px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                <div style={{ width: '6px', height: '6px', borderRadius: '50%', background: lastImportDate ? '#30D158' : '#FF9F0A', boxShadow: lastImportDate ? '0 0 6px #30D158' : '0 0 6px #FF9F0A', flexShrink: 0 }} />
                <span style={{ fontSize: '11px', color: 'rgba(255,255,255,0.35)', fontVariantNumeric: 'tabular-nums' }}>
                  {lastImportDate
                    ? `Interpretation basierend auf Marktdaten vom ${formatTime(lastImportDate)}`
                    : 'Interpretation basierend auf Demo-Daten — bitte CSV importieren'}
                </span>
              </div>
              <button
                onClick={() => setActiveTab('data')}
                style={{ display: 'flex', alignItems: 'center', gap: '4px', padding: '4px 10px', borderRadius: '8px', border: '0.5px solid rgba(255,255,255,0.08)', background: 'rgba(255,255,255,0.03)', color: 'rgba(255,255,255,0.35)', fontSize: '10px', fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit', alignSelf: isMobile ? 'flex-end' : 'auto' }}
                onMouseEnter={e => { e.currentTarget.style.color = '#F5F5F7'; e.currentTarget.style.background = 'rgba(255,255,255,0.08)'; }}
                onMouseLeave={e => { e.currentTarget.style.color = 'rgba(255,255,255,0.35)'; e.currentTarget.style.background = 'rgba(255,255,255,0.04)'; }}>
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><polyline points="15 18 9 12 15 6"/></svg>
                Zur Marktlage
              </button>
            </div>
            <AnalysisView />
          </>
        )}

      </div>

      {/* ── Onboarding Overlay (einmalig nach Login + via ?) ── */}
      {showOnboarding && (
        <OnboardingOverlay
          onboardStep={onboardStep}
          setOnboardStep={setOnboardStep}
          setActiveTab={setActiveTab}
          setShowProfilePanel={setShowProfilePanel}
          setShowConfig={setShowConfig}
          setConfigTab={setConfigTab}
          setDraftThresholds={setDraftThresholds}
          setValidationErrors={setValidationErrors}
          setInputTexts={setInputTexts}
          thresholds={thresholds}
          fromInfo={onboardingFromInfo}
          onFinish={() => {
            setShowOnboarding(false);
            setOnboardingFromInfo(false);
            setOnboardStep(0);
          }}
        />
      )}

      {/* Kontakt Modal */}
      {showContact && (
        <div style={{ position: 'fixed', inset: 0, zIndex: 60, background: 'rgba(0,0,0,0.6)', backdropFilter: 'blur(8px)', WebkitBackdropFilter: 'blur(8px)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '16px' }}>
          <div style={{ background: '#1C1C1E', border: '0.5px solid rgba(255,255,255,0.1)', borderRadius: '20px', padding: '28px', width: '100%', maxWidth: '420px' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px' }}>
              <div>
                <h3 style={{ fontSize: '18px', fontWeight: 700, margin: 0, color: '#F5F5F7' }}>Kontakt</h3>
                <div style={{ fontSize: '11px', color: 'rgba(255,255,255,0.52)', marginTop: '3px' }}>Wir freuen uns über dein Feedback</div>
              </div>
              <button onClick={() => { setShowContact(false); setContactEmail(''); setContactMsg(''); setContactError(''); setContactSent(false); }}
                style={{ background: 'rgba(255,255,255,0.08)', border: 'none', borderRadius: '50%', width: '28px', height: '28px', cursor: 'pointer', color: '#F5F5F7', fontSize: '16px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>×</button>
            </div>

            {contactSent ? (
              <div style={{ textAlign: 'center', padding: '24px 0' }}>
                <div style={{ fontSize: '32px', marginBottom: '12px' }}>✓</div>
                <div style={{ fontSize: '16px', fontWeight: 600, color: '#30D158', marginBottom: '6px' }}>Nachricht gesendet</div>
                <div style={{ fontSize: '12px', color: 'rgba(255,255,255,0.35)' }}>Wir melden uns so schnell wie möglich.</div>
              </div>
            ) : (
              <>
                <div style={{ marginBottom: '12px' }}>
                  <div style={{ fontSize: '11px', fontWeight: 600, color: 'rgba(255,255,255,0.35)', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: '6px' }}>Deine E-Mail</div>
                  <input type="email" value={contactEmail} onChange={e => setContactEmail(e.target.value)}
                    placeholder="du@beispiel.de"
                    style={{ width: '100%', padding: '10px 12px', background: 'rgba(255,255,255,0.06)', border: '0.5px solid rgba(255,255,255,0.1)', borderRadius: '12px', color: '#F5F5F7', fontSize: '13px', outline: 'none', fontFamily: 'inherit', boxSizing: 'border-box' }}
                    onFocus={e => e.target.style.borderColor='rgba(10,132,255,0.5)'}
                    onBlur={e => e.target.style.borderColor='rgba(255,255,255,0.1)'} />
                </div>
                <div style={{ marginBottom: '20px' }}>
                  <div style={{ fontSize: '11px', fontWeight: 600, color: 'rgba(255,255,255,0.35)', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: '6px' }}>Nachricht</div>
                  <textarea value={contactMsg} onChange={e => setContactMsg(e.target.value)}
                    placeholder="Deine Nachricht…" rows={5}
                    style={{ width: '100%', padding: '10px 12px', background: 'rgba(255,255,255,0.06)', border: '0.5px solid rgba(255,255,255,0.1)', borderRadius: '12px', color: '#F5F5F7', fontSize: '13px', outline: 'none', fontFamily: 'inherit', resize: 'vertical', boxSizing: 'border-box' }}
                    onFocus={e => e.target.style.borderColor='rgba(10,132,255,0.5)'}
                    onBlur={e => e.target.style.borderColor='rgba(255,255,255,0.1)'} />
                </div>
                {contactError && (
                  <div style={{ marginBottom: '12px', padding: '8px 12px', borderRadius: '8px', background: 'rgba(255,69,58,0.08)', border: '0.5px solid rgba(255,69,58,0.2)', fontSize: '12px', color: '#FF453A' }}>
                    ⚠ {contactError}
                  </div>
                )}
                <button
                  onClick={async () => {
                    if (!contactEmail.trim() || !contactMsg.trim()) return;
                    setContactSending(true);
                    setContactError('');
                    try {
                      const res = await fetch('https://api.web3forms.com/submit', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({
                          access_key: WEB3FORMS_KEY,
                          subject: 'Volafly Kontakt',
                          from_name: contactEmail.trim(),
                          email: contactEmail.trim(),
                          message: contactMsg.trim(),
                        }),
                      });
                      const json = await res.json();
                      if (!json.success) throw new Error(json.message || 'Fehler');
                      setContactSent(true);
                      setContactEmail('');
                      setContactMsg('');
                    } catch(err) {
                      setContactError('Versand fehlgeschlagen — bitte später erneut versuchen.');
                    }
                    setContactSending(false);
                  }}
                  disabled={!contactEmail.trim() || !contactMsg.trim() || contactSending}
                  style={{ width: '100%', padding: '12px', borderRadius: '12px', border: 'none', fontFamily: 'inherit', fontSize: '14px', fontWeight: 600, transition: 'all 0.2s ease', cursor: (!contactEmail.trim() || !contactMsg.trim() || contactSending) ? 'default' : 'pointer', background: (!contactEmail.trim() || !contactMsg.trim() || contactSending) ? 'rgba(255,255,255,0.06)' : '#0A84FF', color: (!contactEmail.trim() || !contactMsg.trim() || contactSending) ? 'rgba(255,255,255,0.25)' : '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px' }}>
                  {contactSending && <span style={{ display: 'inline-block', width: '12px', height: '12px', border: '1.5px solid rgba(255,255,255,0.3)', borderTopColor: '#fff', borderRadius: '50%', animation: 'spin 0.8s linear infinite' }} />}
                  {contactSending ? 'Wird gesendet…' : 'Nachricht senden'}
                </button>
              </>
            )}
          </div>
        </div>
      )}

    </div>
  );
};

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
